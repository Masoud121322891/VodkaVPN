function QR(s){

for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)st(a+dx,c+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)})});

function g(i){return((t>>>i)&1)==1}

for(var y=0;y<n;y++){var a='',c='';for(var x=0;x<n;x++){a+=M[y][x]?1:0;c+=M[x][y]?1:0}

for(var m=0;m<8;m++){mk(m);fb(m);var p=pen();if(p<bp){bp=p;bm=m}mk(m)}
mk(bm);fb(bm);return M}
