function QR(s){
var d=Array.from(new TextEncoder().encode(s)),

var cap=(raw(v)>>3)-EC[v]*NB[v],b=[];
function put(x,n){for(var i=n-1;i>=0;i--)b.push((x>>>i)&1)}
put(4,4);put(d.length,cc);d.forEach(function(x){put(x,8)});
put(0,Math.min(4,cap*8-b.length));while(b.length%8)b.push(0);
for(var p=0xEC;b.length<cap*8;p^=0xFD)put(p,8);
var cw=[];for(var i=0;i<b.length;i+=8){var y=0;for(var j=0;j<8;j++)y=y*2+b[i+j];cw.push(y)}
function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z}
var e=EC[v],dv=[];for(var i=0;i<e-1;i++)dv.push(0);dv.push(1);

var nb=NB[v],rc=raw(v)>>3,ns=nb-rc%nb,sl=(rc/nb|0),bl=[],k=0;
for(var i=0;i<nb;i++){var dt=cw.slice(k,k+sl-e+(i<ns?0:1));k+=dt.length;var r=dv.map(function(){return 0});
dt.forEach(function(x){var f=x^r.shift();r.push(0);dv.forEach(function(c,q){r[q]^=mul(c,f)})});

function fd(x,y){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var m=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n)st(xx,yy,m!=2&&m!=4)}}

var ap=[];if(v>1){var na=(v/7|0)+2,step=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2;ap=[6];for(var q=n-7;ap.length<na;q-=step)ap.splice(1,0,q)}

for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)st(a+dx,c+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)})});

function g(i){return((t>>>i)&1)==1}

M[y][x]=M[y][x]!=z}}

if(x>0&&M[y][x]==M[y][x-1]){rr++;if(rr==5)s+=3;else if(rr>5)s++}else rr=1;
if(x>0&&M[x][y]==M[x-1][y]){cr++;if(cr==5)s+=3;else if(cr>5)s++}else cr=1;
if(x>0&&y>0&&M[y][x]==M[y][x-1]&&M[y][x]==M[y-1][x]&&M[y][x]==M[y-1][x-1])s+=3}}
for(var y=0;y<n;y++){var a='',c='';for(var x=0;x<n;x++){a+=M[y][x]?1:0;c+=M[x][y]?1:0}
[a,c].forEach(function(z){var q=z.match(/(?=00001011101|10111010000)/g);if(q)s+=40*q.length})}
return s+Math.floor(Math.abs(dk*20-n*n*10)/(n*n))*10}
var bm=0,bp=1e9;
for(var m=0;m<8;m++){mk(m);fb(m);var p=pen();if(p<bp){bp=p;bm=m}mk(m)}
mk(bm);fb(bm);return M}
