<title>Hiddify</title>
<style>
:root{--gr:#239f40;--gr2:#17772d;--rd:#da0000;--rd2:#a80000;--w:#fff;--ink:#16202a;--mu:rgba(22,32,42,.62);--ln:rgba(22,32,42,.1);--cd:#fff;--sh:#fff;--c1:var(--gr);--lion:#1d8a38;--mane:#15702b;--gold:#e3a812;--gd:#7a4e00;--g1:#f7c948;--g2:#d69808;--ry:var(--gold)}
html[data-th=dark]{--gr:#2db84d;--gr2:#0f4f20;--rd2:#6e0000;--w:#10161e;--ink:#f2f5f7;--mu:rgba(242,245,247,.62);--ln:rgba(255,255,255,.12);--cd:#1b2430;--sh:#151c26;--lion:#2db84d;--mane:#1d8a38;--gold:#f2b92b;--gd:#8a5a00;--g1:#ffd35a;--g2:#e0a410}
html[data-h=warn],html[data-h=bad]{--ry:var(--rd)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--rd2);color:var(--ink);font:15px/1.6 Vazirmatn,Vazir,Tahoma,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{width:min(100%,520px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.sec{padding:0 20px}
.g{padding-top:max(20px,env(safe-area-inset-top));padding-bottom:22px;background:linear-gradient(180deg,var(--gr2),var(--gr));color:#fff}
.wt{position:relative;z-index:2;margin:0;padding:22px 20px 30px;background:var(--w);text-align:center}
.r{flex:1;padding-top:26px;padding-bottom:calc(30px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--rd),var(--rd2));color:#fff}
header{position:relative;z-index:35;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{margin:0;font-size:23px;line-height:1.35;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header small{display:block;opacity:.8;font-size:12px}
.tl{display:flex;gap:7px;direction:ltr;order:1;margin-inline-start:auto}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0;flex:none;transition:transform .15s}.ib:active{transform:scale(.9)}.ib svg{width:18px;height:18px}
.nt{display:none;margin-top:12px;padding:10px 14px;border-radius:16px;background:#fff;color:var(--ink);text-align:center;font-size:12.5px;font-weight:650}.nt.on{display:block}#al{color:var(--rd)}
.emb{width:min(94vw,390px);aspect-ratio:330/239;margin:0 auto;animation:pop .8s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.emb svg{width:100%;height:100%;overflow:visible}
.ry path{fill:color-mix(in srgb,var(--gold) 20%,transparent);transition:fill .35s}.ry path.on{fill:var(--ry)}.gd path{fill:url(#gg)}.emb svg{filter:drop-shadow(0 10px 14px rgba(190,130,0,.28))}.sn{fill:var(--gold);stroke:var(--gd);stroke-width:3}.o{fill:var(--gd);stroke:var(--gd);stroke-width:7;stroke-linejoin:round}.f{fill:var(--gold);stroke:none}.dk{fill:var(--gd)}.ds{fill:none;stroke:var(--gd);stroke-width:2.6;stroke-linecap:round}
.emb svg{stroke:none}
.ln{fill:var(--lion);stroke:none}.mn circle{fill:var(--mane);stroke:none}.lt{fill:none;stroke:var(--lion);stroke-width:7}.sw{fill:none;stroke:var(--rd);stroke-width:5}
.lbl{margin:6px 0 0;font-size:12px;font-weight:650;color:var(--mu)}
.num{font-size:clamp(50px,17vw,68px);font-weight:850;line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.un{font-size:15px;font-weight:800;letter-spacing:.12em;direction:ltr;color:var(--gr)}
.say{margin:10px 0 0;font-size:17px;font-weight:800}.sub{margin:0;color:var(--mu);font-size:13px}
.go{width:100%;min-height:62px;border:0;border-radius:22px;background:#fff;color:var(--rd);font-size:18px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -14px #000;transition:transform .15s}.go:active{transform:scale(.97)}.go svg{width:23px;height:23px;stroke-width:2.4}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cd{padding:16px;border:0;border-radius:24px;background:var(--cd);color:var(--ink);text-align:start;display:flex;flex-direction:column;gap:10px;transition:transform .15s}.cd:active{transform:scale(.97)}
.cd .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr)}.cd .ic svg{width:21px;height:21px}
.cd b{display:block;font-size:15px;line-height:1.3}.cd small{display:block;color:var(--mu);font-size:11.5px}
.rw{display:flex;gap:12px;margin-top:12px}
.bn{flex:1;min-height:46px;padding:0 14px;border:0;border-radius:18px;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}.bn svg{width:17px;height:17px}.bn:active{transform:scale(.97)}
.ft{margin:16px 0 0;text-align:center;opacity:.85;font-size:12px}
.bd{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.5);opacity:0;pointer-events:none;transition:opacity .3s}.bd.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;width:min(100%,520px);margin:0 auto;max-height:84dvh;display:flex;flex-direction:column;border-radius:32px 32px 0 0;background:var(--sh);color:var(--ink);box-shadow:0 -20px 60px -20px #000;transform:translateY(106%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}.sheet.on{transform:none}
.sheet:before{content:"";height:5px;margin:0;border-radius:32px 32px 0 0;background:linear-gradient(90deg,var(--gr) 33%,#fff 33% 66%,var(--rd) 66%)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}.sh h2{margin:0;font-size:20px}.sheet .ib{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.sb{overflow:auto;padding:4px 18px calc(26px + env(safe-area-inset-bottom));display:grid;gap:10px;align-content:start}
.sr{width:100%;height:44px;padding:0 16px;border:1.5px solid var(--ln);border-radius:16px;background:transparent;outline:0}.sr:focus{border-color:var(--gr)}
.sheet .bn{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}.sheet .bn.ok{color:var(--gr)}.sheet .bn.p{background:var(--gr);color:#fff}
.cf{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px;border-radius:20px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cf .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--gr);background:color-mix(in srgb,var(--gr) 15%,transparent);overflow:hidden}.cf .ic svg{width:19px;height:19px}.cf .ic img{width:100%;height:100%;object-fit:cover}
.nm{min-width:0}.nm b{display:block;font-size:13px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{display:block;color:var(--mu);font-size:10.5px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{display:flex;gap:6px}.ra .ib{width:36px;height:36px}
.oc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.oc button{min-height:42px;border:0;border-radius:15px;background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:12.5px;font-weight:700}.oc button.on{background:var(--gr);color:#fff}.oc button.me:after{content:"";display:inline-block;width:6px;height:6px;margin-inline-start:6px;border-radius:50%;background:var(--rd)}
.ap{padding:12px;border-radius:22px;background:color-mix(in srgb,var(--ink) 5%,transparent)}.ap .cf{padding:0;background:0}.ap p{margin:0;color:var(--mu);font-size:11px;white-space:normal}
.aa{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.aa .bn{flex:1 1 40%;min-height:40px}
.tg{font-size:10px;margin-inline-start:6px;padding:1px 8px;border-radius:99px;background:var(--rd);color:#fff}
.em{padding:26px;text-align:center;color:var(--mu);border-radius:20px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.qm{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(10,14,20,.6)}.qm.on{display:grid}
.qk{width:min(86vw,300px);padding:18px;text-align:center;border-radius:28px;background:var(--sh);color:var(--ink);animation:pop .4s cubic-bezier(.2,1.2,.3,1)}.qk h3{margin:0 0 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc{width:100%;aspect-ratio:1;border-radius:18px;background:#fff;display:grid;place-items:center;color:#111;padding:6px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}.qc canvas{width:100%;height:100%;image-rendering:pixelated}
.ts{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;padding:11px 20px;border-radius:99px;background:var(--ink);color:var(--w);font-size:13px;font-weight:700;transition:.25s cubic-bezier(.2,1.4,.4,1)}.ts.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
